name: cn-play
description: CN-PLAY - Your Games, Your Console. Built on Bazzite.
base-image: ghcr.io/ublue-os/bazzite   # use bazzite-nvidia if you have an NVIDIA GPU
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      - chromium        # runs the CN-PLAY interface in fullscreen kiosk mode
      - htop

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.mozilla.firefox
          - com.discordapp.Discord

  - type: script
    scripts:
      - rebrand.sh

  - type: signing
