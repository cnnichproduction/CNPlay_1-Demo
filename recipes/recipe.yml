name: myos
description: My own OS, based on Bazzite
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      - neovim
      - htop

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.mozilla.firefox
          - com.discordapp.Discord

  - type: script
    scripts:
      - rebrand.sh

  - type: signing
